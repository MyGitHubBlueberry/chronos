services:
  backend:
    image: "chronos-api:v1"
    build: ./backend
    ports:
      - "3000:3000"
    command: npm start
    environment:
      MONGO_URI: "mongodb://mongodb:27017/chronos"
      MONGO_USERNAME: "${MONGO_ROOT_USERNAME}"
      MONGO_PASSWORD: "${MONGO_ROOT_PASSWORD}"
    depends_on:
      - mongodb
  
  mongodb:
    image: mongo:9.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: "${MONGO_ROOT_USERNAME}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_ROOT_PASSWORD}"
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data:
